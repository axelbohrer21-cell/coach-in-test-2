name: Coach In QA campaign

on:
  pull_request:
    branches: [main]
  push:
    branches: ['qa/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    name: Domain tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run domain test suite
        run: npm test
      - name: Syntax-check application JavaScript
        run: |
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
