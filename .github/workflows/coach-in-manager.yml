name: Coach In Manager validation

on:
  push:
    branches:
      - feat/coach-in-manager-eve-2026-11-25
      - feat/manager-persistent-memory-coordination-2026-11-26
    paths:
      - "agent-manager/**"
      - ".github/workflows/coach-in-manager.yml"
  pull_request:
    paths:
      - "agent-manager/**"
      - ".github/workflows/coach-in-manager.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-manager:
    name: Build private Manager agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-manager
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      # Eve's Vercel sandbox templates require Vercel OIDC. GitHub Actions does
      # not receive that token; the protected Vercel Preview performs eve build.
      - name: Test automatic reviewer routing
        run: npm run test:routing
      - name: Test dependency handoffs and review aggregation
        run: npm run test:coordination
      - name: Test mission dependency planner
        run: npm run test:planning
      - name: Test production agent registry and tool boundaries
        run: npm run test:agents
      - name: Verify Eve agent and tool discovery
        run: npm run check:discovery
      - name: Test mission memory privacy guard
        run: npm run test:memory-privacy
      - name: Test Manager access control
        run: npm run test:security
      - name: Typecheck authored agents and workflows
        run: npm run typecheck
      - name: Typecheck Manager web interface
        run: npm run typecheck:web
