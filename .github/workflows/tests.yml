name: Coach In — tests automatisés

on:
  push:
    branches:
      - migration/cloudflare-pages
  pull_request:
    branches:
      - migration/cloudflare-pages
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests du domaine
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exécuter les tests automatisés
        run: npm test
